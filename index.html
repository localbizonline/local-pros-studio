        var link = e.target && e.target.closest && e.target.closest('a[href*="wa.me/"], a[href*="api.whatsapp.com/"]');

        gtag('event', 'conversion', { send_to: 'AW-18487782572/uFs2CMjBlo0dEKzZ1O9E', transport_type: 'beacon' });
      }, true);
